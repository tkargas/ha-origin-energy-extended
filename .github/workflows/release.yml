name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create ZIP file for release
        run: |
          cd custom_components/origin_energy
          zip -r ../../origin_energy.zip .
          cd ../..

      - name: Upload ZIP to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: origin_energy.zip
          asset_name: origin_energy.zip
          tag: ${{ github.ref }}
          overwrite: true
